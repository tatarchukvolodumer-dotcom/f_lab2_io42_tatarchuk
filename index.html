<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <table class="variant-table">

        <tr class="first-row">
            <td>Татарчук</td>
            <td>Володимир</td>
            <td rowspan="3" class="patronymic">Андрійович</td>
            <td colspan="2"></td>
            <td colspan="2" rowspan="2" class="variant-cell">Варіант 82</td>
        </tr>

        <tr class="second-row">
            <td colspan="2">ІО-42</td>
            <td colspan="2">Лабораторна 2</td>
        </tr>

        <tr class="third-row">
            <td colspan="2"></td>
            <td colspan="4"></td>
        </tr>

    </table>

    <h2>Варіант 2</h2>

    <div class="images-container">

        <div class="image-block">
            <h3>1. За допомогою position</h3>

            <div class="flag-position">
                <div class="position-horizontal"></div>
                <div class="position-vertical"></div>
            </div>
        </div>

        <div class="image-block">
            <h3>2. За допомогою transform</h3>

            <div class="flag-transform">
                <div class="transform-line"></div>
                <div class="transform-line transform-vertical"></div>
            </div>
        </div>

    </div>

</body>
</html>
